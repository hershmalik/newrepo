<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Longshots</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e8ec; --muted: #9aa3b2; --accent: #4ade80; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  button { background: var(--accent); color: #06220f; border: 0; border-radius: 8px;
           padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 28px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .bet { font-weight: 650; font-size: 16px; }
  .odds { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: 13px; }
  .score { display: inline-block; background: #1f2937; border-radius: 6px;
           padding: 1px 8px; font-size: 12px; color: var(--warn); margin-right: 8px; }
  ul.reasons { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .leg { padding: 6px 0; border-top: 1px dashed var(--border); font-size: 14px; }
  .leg:first-of-type { border-top: 0; }
  .flag { color: var(--warn); font-size: 12px; }
  .empty { color: var(--muted); padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏈 NFL Longshots</h1>
  <div class="sub" id="meta">Loading…</div>
  <button id="scanBtn" onclick="scan()">Run new scan</button>

  <h2>Single-leg longshots</h2>
  <div id="singles"></div>

  <h2>2–3 leg parlays</h2>
  <div id="parlays"></div>
</div>
<script>
async function load() {
  const r = await fetch('/api/picks');
  const d = await r.json();
  document.getElementById('meta').textContent = d.generatedAt
    ? `Last scan: ${new Date(d.generatedAt).toLocaleString()}${d.oddsApiCreditsRemaining != null ? ` · ${d.oddsApiCreditsRemaining} API credits left` : ''}`
    : 'No scan yet — run one.';
  const singles = document.getElementById('singles');
  singles.innerHTML = (d.singles || []).map(s => `
    <div class="card">
      <div class="row">
        <span class="bet">${esc(s.bet)}</span>
        <span class="odds">${esc(s.odds)}</span>
      </div>
      <div class="meta"><span class="score">score ${s.score}</span>${esc(s.game)} · ${esc(s.book)} · ${esc(s.depth || '')}</div>
      <ul class="reasons">${(s.reasons || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    </div>`).join('') || '<div class="empty">Nothing cleared the threshold. Injury reports firm up Fri/Sat.</div>';

  const parlays = document.getElementById('parlays');
  parlays.innerHTML = (d.parlays || []).map(p => `
    <div class="card">
      <div class="row">
        <span class="bet">Combined ${esc(p.combinedLabel)}</span>
        <span class="meta"><span class="score">score ${p.totalScore}</span>${p.sameGame ? '<span class="flag">same-game — book will reprice</span>' : ''}</span>
      </div>
      ${p.legs.map(l => `<div class="leg">${esc(l.bet)} <span class="odds">${l.price > 0 ? '+' : ''}${l.price}</span> <span class="meta">@ ${esc(l.book)} · ${esc(l.game)}</span></div>`).join('')}
    </div>`).join('') || '<div class="empty">No qualifying parlays.</div>';
}
async function scan() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true; btn.textContent = 'Scanning… (1-2 min)';
  await fetch('/api/scan', { method: 'POST' });
  const poll = setInterval(async () => {
    const s = await (await fetch('/api/status')).json();
    if (!s.scanning) { clearInterval(poll); btn.disabled = false; btn.textContent = 'Run new scan'; load(); }
  }, 3000);
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
load();
</script>
</body>
</html>
